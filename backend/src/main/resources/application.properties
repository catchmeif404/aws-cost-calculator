spring.application.name=backend

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aws_calculator}
spring.datasource.username=${DB_USER:aws_calculator}
spring.datasource.password=${DB_PASSWORD:aws_calculator}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Railway injects PORT dynamically at deploy time; SERVER_PORT stays as the local-dev override.
server.port=${PORT:${SERVER_PORT:8080}}

# Railway (and most PaaS reverse proxies) terminate TLS externally and forward to the container
# over plain HTTP, setting X-Forwarded-Proto/Host/Port. Without this, Spring reconstructs
# {baseUrl} (used by OAuth2's default redirect-uri template) from the internal http:// request,
# producing a redirect_uri Google/Kakao reject as a mismatch against the registered https:// one.
server.forward-headers-strategy=framework

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002}

# AI explanation/recommendation adapters (see com.awscalculator.backend.ai and .recommendation).
# `provider` picks which AiExplainer/ArchitectureRecommendationAdvisor bean is primary by name():
# "codex-cli" shells out to a locally installed codex CLI (fine for local dev, but there's no
# codex binary in the deployed Docker image, so it always fails over to rule-based there);
# "claude-api" / "gemini-api" call the real Anthropic/Google APIs and are what should be set in
# non-local environments. Falls back to rule-based on any failure either way.
ai.explainer.provider=${AI_EXPLAINER_PROVIDER:codex-cli}
ai.explainer.enabled=${AI_EXPLAINER_ENABLED:true}
ai.explainer.codex-command=${AI_EXPLAINER_CODEX_COMMAND:codex}
ai.explainer.timeout-seconds=${AI_EXPLAINER_TIMEOUT_SECONDS:45}
ai.explainer.claude.max-tokens=${AI_EXPLAINER_CLAUDE_MAX_TOKENS:600}
ai.explainer.gemini.max-tokens=${AI_EXPLAINER_GEMINI_MAX_TOKENS:600}
ai.recommendation.provider=${AI_RECOMMENDATION_PROVIDER:codex-cli}
ai.recommendation.enabled=${AI_RECOMMENDATION_ENABLED:true}
ai.recommendation.codex-command=${AI_RECOMMENDATION_CODEX_COMMAND:codex}
ai.recommendation.timeout-seconds=${AI_RECOMMENDATION_TIMEOUT_SECONDS:120}
ai.recommendation.claude.max-tokens=${AI_RECOMMENDATION_CLAUDE_MAX_TOKENS:1600}
ai.recommendation.gemini.max-tokens=${AI_RECOMMENDATION_GEMINI_MAX_TOKENS:1600}
ai.optimization.provider=${AI_OPTIMIZATION_PROVIDER:codex-cli}
ai.optimization.enabled=${AI_OPTIMIZATION_ENABLED:true}
ai.optimization.codex-command=${AI_OPTIMIZATION_CODEX_COMMAND:codex}
ai.optimization.timeout-seconds=${AI_OPTIMIZATION_TIMEOUT_SECONDS:120}
ai.optimization.claude.max-tokens=${AI_OPTIMIZATION_CLAUDE_MAX_TOKENS:900}
ai.optimization.gemini.max-tokens=${AI_OPTIMIZATION_GEMINI_MAX_TOKENS:900}

# Shared Anthropic API credentials for the claude-api provider above.
ai.claude.api-key=${ANTHROPIC_API_KEY:}
ai.claude.model=${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}
ai.claude.timeout-seconds=${ANTHROPIC_TIMEOUT_SECONDS:60}

# Shared Google Gemini API credentials for the gemini-api provider above. Free API key (no card,
# generous free-tier limits): https://aistudio.google.com/apikey
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
ai.gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:60}

# Auth / credit system. Placeholders below let the app boot cleanly without real OAuth
# credentials — Spring's ClientRegistration.Builder throws at boot on an EMPTY client-id, so
# these fall back to non-blank placeholder strings, not "". Real login only fails lazily, when
# a user actually clicks through to Google/Kakao and gets an invalid_client rejection.
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:3002}
app.jwt.secret=${JWT_SECRET:local-dev-only-jwt-secret-change-me-32chars+}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:10080}
app.credit.signup-bonus=${SIGNUP_BONUS_CREDITS:3}

app.admin.emails=${APP_ADMIN_EMAILS:}

# Shared secret for catchmeif404-admin's aggregator to call /api/internal/metrics/** - unrelated
# to app.admin.emails above (that's for human ROLE_ADMIN users, this is service-to-service). Blank
# by default, which InternalApiKeyFilter treats as "reject everything" rather than "open".
app.admin.metrics-api-key=${ADMIN_METRICS_API_KEY:}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:placeholder-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:placeholder-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Kakao is not a Spring CommonOAuth2Provider, so both registration and provider endpoints must
# be declared manually. Client Secret must be turned on explicitly in the Kakao console (off by
# default) even though it's still required here once enabled.
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:placeholder-kakao-client-id}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:placeholder-kakao-client-secret}
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email
spring.security.oauth2.client.registration.kakao.client-name=Kakao

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id
