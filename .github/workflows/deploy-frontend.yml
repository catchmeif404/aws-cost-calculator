name: Deploy Frontend

# Builds the Next.js app with vinext and deploys it to Cloudflare Workers.
#
# NEXT_PUBLIC_API_BASE_URL must be present at BUILD time, not just set on the Workers
# dashboard afterward — Next.js inlines NEXT_PUBLIC_* env vars into the client JS bundle
# during `vinext build`, so a value added later never reaches already-built static files.
# This is exactly what broke the manual deploy this workflow replaces: the previous build
# had no NEXT_PUBLIC_API_BASE_URL, so the fallback `http://localhost:8080` got baked into
# the bundle and every API call from real visitors failed.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Generates .next/types + next-env.d.ts (e.g. the ambient LayoutProps/PageProps types
      # app/layout.tsx relies on). Locally these exist as a side effect of `next dev` having
      # run at some point; a fresh CI checkout has neither, so tsc fails without this step.
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build (vinext)
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
        run: npm run build:vinext

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:vinext
